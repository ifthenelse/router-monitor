name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            command: cargo test --locked
          - name: macOS universal
            os: macos-14
            command: |
              cargo test --locked
              rustup target add x86_64-apple-darwin
              cargo check --locked --target x86_64-apple-darwin
          - name: Windows
            os: windows-2025-vs2026
            command: cargo test --locked

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}

  linux-distributions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: rust:bookworm
            setup: apt-get update && apt-get install -y --no-install-recommends pkg-config ca-certificates
          - name: Arch
            image: archlinux:latest
            setup: pacman -Sy --noconfirm --needed base-devel rust pkgconf ca-certificates

    steps:
      - uses: actions/checkout@v6
      - run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ${{ matrix.image }} \
            sh -lc 'export PATH=/usr/local/cargo/bin:$PATH && ${{ matrix.setup }} && cargo test --locked'
